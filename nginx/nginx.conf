# Пересозданный контейнер получает новый IP, а nginx резолвит имена из
# upstream один раз при старте — отсюда 502 после каждого `compose up`.
# Резолвер Docker + имя в переменной заставляют перечитывать адрес на лету.
resolver 127.0.0.11 valid=10s ipv6=off;

# Значение Connection для проксирования: апгрейд пробрасываем только тогда,
# когда клиент его действительно запросил.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Заголовки безопасности (ТЗ §35).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Метрики не должны быть доступны из интернета.
    set $api_upstream http://api:8000;
    set $panel_upstream http://frontend:3000;

    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass $api_upstream$request_uri;
    }

    location /ws {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Всё, что относится к бэкенду, — явными префиксами.
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass $api_upstream$request_uri;
    }

    location = /ready {
        proxy_pass $api_upstream$request_uri;
    }

    location = /live {
        proxy_pass $api_upstream$request_uri;
    }

    location = /openapi.json {
        proxy_pass $api_upstream$request_uri;
    }

    location /docs {
        proxy_pass $api_upstream$request_uri;
    }

    # Остальное — панель. Next.js в dev-режиме использует свой websocket для
    # горячей перезагрузки, поэтому заголовки апгрейда нужны и здесь.
    location / {
        proxy_pass $panel_upstream$request_uri;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
