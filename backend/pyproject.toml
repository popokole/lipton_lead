[project]
name = "telegram-ai-platform"
version = "0.1.0"
description = "Telegram AI automation platform: chat monitoring, rules, AI replies"
requires-python = ">=3.12"

dependencies = [
    # API
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.34,<0.36",
    "python-multipart>=0.0.20,<0.1",
    "websockets>=13,<16",
    # Конфигурация и валидация
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    # Хранилища
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "pgvector>=0.3.6,<0.5",
    "redis>=5.2,<7",
    # Безопасность
    "cryptography>=44,<47",
    "pyjwt>=2.10,<3",
    "argon2-cffi>=23.1,<26",
    # Telegram
    "telethon>=1.38,<2",
    "python-socks[asyncio]>=2.5,<3",
    # Чтение tdata из Telegram Desktop. opentele работает поверх Qt, поэтому
    # PyQt5 обязателен; сам opentele ставится в Dockerfile с --no-deps.
    "PyQt5>=5.15,<6",
    # AI
    "openai>=1.60,<3",
    "tiktoken>=0.8,<1",
    # Документы для базы знаний
    "pypdf>=5.1,<7",
    "python-docx>=1.1,<2",
    # Наблюдаемость и утилиты
    "structlog>=24.4,<26",
    "prometheus-fastapi-instrumentator>=7.0,<8",
    "tenacity>=9.0,<10",
    "httpx[socks]>=0.28,<0.29",
    "typer>=0.15,<0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6.0,<8",
    "ruff>=0.9,<0.15",
    "mypy>=1.14,<2",
    "asgi-lifespan>=2.1,<3",
]
# opentele ставится отдельной командой в Dockerfile: pip не умеет применять
# --no-deps к одному пакету из списка зависимостей.

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "ASYNC",     # asyncio-специфичные ошибки
    "BLE",       # слепой except
    "RUF",
]
ignore = [
    "B008",   # Depends() в аргументах по умолчанию — идиома FastAPI
    "RUF001", # кириллица в строках рядом с латиницей — у нас так везде
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "prometheus_fastapi_instrumentator.*",
    "pgvector.*",
    "telethon.*",
    "opentele.*",
]
ignore_missing_imports = true

# redis-py объявляет асинхронные методы как `Awaitable[T] | T`, поэтому любой
# `await client.smembers(...)` mypy считает ошибкой. Расставлять cast на каждый
# вызов Redis — хуже, чем не проверять типы самой библиотеки.
[[tool.mypy.overrides]]
module = ["redis.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: требует запущенных PostgreSQL и Redis",
]
